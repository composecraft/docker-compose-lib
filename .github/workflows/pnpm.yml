name: Publish Package to npmjs
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
      - name: Extract the release notes
        run: node scripts/changelog.mjs "${{ steps.version.outputs.version }}" | tee release-notes.md
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Real-world compose validation
        run: pnpm run test:real
      # pinned: npm@latest outruns the runner's node and breaks the release
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@12
      - name: Publish
        run: npm publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag $prerelease
